name: Deploy Cloudflare backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-cloudflare.yml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global wrangler@4
      - name: Create or find D1 database
        id: db
        shell: bash
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          DB_ID=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API" | jq -r '.result[] | select(.name=="maktumbook-db") | .uuid' | head -1)
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            DB_ID=$(curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data '{"name":"maktumbook-db"}' "$API" | jq -r '.result.uuid')
          fi
          test -n "$DB_ID" && test "$DB_ID" != "null"
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Generate config
        run: sed "s/generated-by-github-actions/${{ steps.db.outputs.db_id }}/" worker/wrangler.toml.example > worker/wrangler.toml
      - name: Apply schema
        run: wrangler d1 execute maktumbook-db --remote --file=worker/schema.sql --config=worker/wrangler.toml
      - name: Upload JWT secret
        run: printf '%s' '${{ secrets.JWT_SECRET }}' | wrangler secret put JWT_SECRET --config=worker/wrangler.toml
      - name: Deploy API
        run: wrangler deploy --config=worker/wrangler.toml
      - name: Create isolated smoke-test admin
        env:
          SMOKE_RUN_ID: ${{ github.run_id }}
        run: |
          node scripts/create-smoke-admin-sql.mjs > /tmp/maktumbook-smoke-admin.sql
          wrangler d1 execute maktumbook-db --remote --file=/tmp/maktumbook-smoke-admin.sql --config=worker/wrangler.toml
      - name: Test complete purchase and access scenario
        env:
          API_URL: https://maktumbook-api.nil-hab25.workers.dev
          SMOKE_RUN_ID: ${{ github.run_id }}
          SMOKE_ADMIN_EMAIL: smoke-admin-${{ github.run_id }}@example.com
        run: node scripts/smoke-test.mjs
      - name: Remove smoke-test data
        if: always()
        run: |
          wrangler d1 execute maktumbook-db --remote --command="DELETE FROM entitlements WHERE user_id IN (SELECT id FROM users WHERE email LIKE 'smoke-%@example.com'); DELETE FROM purchase_requests WHERE user_id IN (SELECT id FROM users WHERE email LIKE 'smoke-%@example.com'); DELETE FROM books WHERE title LIKE 'کتاب آزمایشی %'; DELETE FROM users WHERE email LIKE 'smoke-%@example.com';" --config=worker/wrangler.toml
